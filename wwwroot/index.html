<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>VPS Monitoring Desktop</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="VPS Monitor Desktop App.styles.css" />
    <link rel="icon" href="data:,">
    <style>
        /* Diagnostic panel — collapsed by default (1 baris status), expand on click.
           Hijau = aman (Blazor init OK), merah = ada error/TIMEOUT. */
        #diagnostic {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-height: 50vh;
            background: #1a1a1a;
            color: #d4d4d4;
            font-family: monospace;
            font-size: 11px;
            border-top: 2px solid #198754;
            z-index: 99999;
            white-space: pre-wrap;
            display: flex;
            flex-direction: column;
        }
        #diagnostic.has-error {
            border-top-color: #dc3545;
        }
        #diagnostic.collapsed .diag-body {
            display: none;
        }
        .diag-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 12px;
            cursor: pointer;
            user-select: none;
            font-weight: 600;
            color: #75e0a0;
            background: rgba(25, 135, 84, 0.1);
        }
        #diagnostic.has-error .diag-header {
            color: #ff8888;
            background: rgba(220, 53, 69, 0.1);
        }
        .diag-header .toggle-icon {
            font-family: monospace;
            opacity: 0.7;
        }
        .diag-body {
            overflow-y: auto;
            padding: 8px 12px;
            max-height: calc(50vh - 28px);
        }
    </style>
</head>

<body data-bs-theme="dark">

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="diagnostic" class="collapsed">
        <div class="diag-header" id="diag-header" role="button" tabindex="0" aria-expanded="false">
            <span id="diag-status">⏳ Diagnostic…</span>
            <span class="toggle-icon" aria-hidden="true">▴</span>
        </div>
        <div class="diag-body" id="diag-body"></div>
    </div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>

    <script>
        // ===== Visible diagnostic untuk debug BlazorWebView init issue =====
        (function () {
            var diag = document.getElementById('diagnostic');
            var diagHeader = document.getElementById('diag-header');
            var diagBody = document.getElementById('diag-body');
            var diagStatus = document.getElementById('diag-status');
            var log = [];
            var hasError = false;

            // Format waktu LOCAL (bukan UTC) — format 24 jam + timezone short
            // Contoh: "13:45:22 WIB" (untuk Asia/Jakarta)
            function fmtTime() {
                try {
                    return new Date().toLocaleTimeString('en-GB', {
                        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
                    }) + ' ' + (Intl.DateTimeFormat().resolvedOptions().timeZone || '');
                } catch (e) {
                    return new Date().toTimeString().slice(0, 8);
                }
            }

            function append(msg) {
                log.push('[' + fmtTime() + '] ' + msg);
                if (diagBody) {
                    diagBody.textContent = log.join('\n');
                    diagBody.scrollTop = diagBody.scrollHeight;
                }
                // Tandai error + update status banner
                if (/ERROR|UNHANDLED|TIMEOUT|Gagal|❌|fail/i.test(msg)) {
                    hasError = true;
                    updateStatus();
                }
            }

            function updateStatus() {
                if (!diag || !diagStatus) return;
                if (hasError) {
                    diag.classList.add('has-error');
                    diagStatus.textContent = '⚠️ Diagnostic: ada error — klik untuk expand';
                } else if (log.length > 0) {
                    diagStatus.textContent = '✅ Diagnostic: aman — klik untuk expand';
                }
            }

            // Toggle collapse/expand on header click
            function toggle() {
                if (!diag) return;
                var collapsed = diag.classList.toggle('collapsed');
                var icon = diagHeader.querySelector('.toggle-icon');
                if (icon) icon.textContent = collapsed ? '▴' : '▾';
                if (diagHeader) diagHeader.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
            }
            if (diagHeader) {
                diagHeader.addEventListener('click', toggle);
                diagHeader.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
                });
            }

            // Capture JS errors
            window.addEventListener('error', function (e) {
                append('ERROR: ' + e.message + ' @ ' + e.filename + ':' + e.lineno);
            });

            // Capture unhandled promise rejections
            window.addEventListener('unhandledrejection', function (e) {
                append('UNHANDLED: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
            });

            // Capture Blazor-specific events
            document.addEventListener('DOMContentLoaded', function () {
                append('DOMContentLoaded');
            });
            window.addEventListener('load', function () {
                append('window.load');
            });
            window.addEventListener('beforeunload', function () {
                append('beforeunload');
            });

            // Check if Blazor started (after a delay)
            setTimeout(function () {
                var appEl = document.getElementById('app');
                if (appEl && (!appEl.hasChildNodes() || appEl.innerHTML.trim() === '')) {
                    append('TIMEOUT 5s: #app masih kosong. Blazor init kemungkinan gagal.');
                    append('window.Blazor: ' + (window.Blazor ? 'EXISTS' : 'undefined'));
                } else {
                    append('5s check: #app ada content, Blazor sepertinya init OK');
                }
                updateStatus();
            }, 5000);

            setTimeout(function () {
                append('15s check: diagnostic complete, #' + log.length + ' log entries');
                if (log.length < 3) {
                    append('Catatan: log sedikit — kemungkinan Blazor script tidak jalan sama sekali.');
                }
                updateStatus();
            }, 15000);

            append('Diagnostic script loaded');
            updateStatus();
        })();
    </script>

</body>

</html>
