<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>VPS Monitoring Desktop</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="VPS Monitor Desktop App.styles.css" />
    <link rel="icon" href="data:,">
    <style>
        /* Loading state — eksplisit kelihatan walau Blazor belum load.
           Dipakai untuk debug black screen. */
        #app-loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1rem;
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            z-index: 9999;
        }
        #app-loading .spinner {
            width: 3rem;
            height: 3rem;
            border: 4px solid #444;
            border-top-color: #0d6efd;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #app-loading .title {
            font-size: 1.25rem;
            font-weight: 600;
        }
        #app-loading .subtitle {
            font-size: 0.875rem;
            color: #888;
        }
    </style>
</head>

<body data-bs-theme="dark">

    <div class="status-bar-safe-area"></div>

    <!-- Loading screen — terlihat sampai Blazor app mount -->
    <div id="app-loading">
        <div class="spinner"></div>
        <div class="title">VPS Monitoring Desktop</div>
        <div class="subtitle">Loading…</div>
    </div>

    <!-- Blazor mount point -->
    <div id="app"></div>

    <!-- Error UI (shown kalau Blazor error) -->
    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- Blazor framework script untuk MAUI Hybrid. autostart=false — di-start oleh MAUI host. -->
    <script src="_framework/blazor.webview.js" autostart="false"></script>

    <!-- Fallback: kalau setelah 5 detik Blazor belum load, tambah info untuk debug -->
    <script>
        // Tunggu 5 detik, lalu cek status loading
        setTimeout(function () {
            var loading = document.getElementById('app-loading');
            if (!loading) return; // Blazor sudah mount & remove loading, OK

            // Loading masih ada setelah 5 detik — Blazor stuck
            var sub = loading.querySelector('.subtitle');
            if (sub) {
                sub.innerHTML = 'Blazor butuh waktu lama untuk inisialisasi.<br>Cek <b>WebView2 Runtime</b>, <b>.NET 10 Runtime</b>, dan <b>Windows App Runtime</b> sudah terinstall.';
                sub.style.color = '#ffaa66';
            }
        }, 5000);

        // Hard fallback setelah 15 detik
        setTimeout(function () {
            var loading = document.getElementById('app-loading');
            if (!loading) return;

            var sub = loading.querySelector('.subtitle');
            if (sub) {
                sub.innerHTML = '<b>Blazor tidak bisa inisialisasi.</b><br>Kemungkinan dependency missing atau ada error.<br><br>' +
                    '<b>Cara debug:</b><br>' +
                    '1. Tutup app<br>' +
                    '2. Buka <b>Command Prompt</b> (cmd)<br>' +
                    '3. cd ke folder install (mis. C:\\Program Files\\VPS Monitoring Desktop)<br>' +
                    '4. Jalankan: <code style="background:#000;padding:2px 6px;border-radius:3px">VPS Monitor Desktop App.exe</code><br>' +
                    '5. Lihat error di console';
                sub.style.color = '#ff8888';
            }
            var spinner = loading.querySelector('.spinner');
            if (spinner) spinner.style.display = 'none';
        }, 15000);
    </script>

</body>

</html>
