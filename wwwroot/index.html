<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>VPS Monitoring Desktop</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="VPS Monitor Desktop App.styles.css" />
    <link rel="icon" href="data:,">
    <style>
        /* Loading state — eksplisit kelihatan walau Blazor belum load.
           Dipakai untuk debug black screen. */
        #app-loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1rem;
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            z-index: 9999;
        }
        #app-loading .spinner {
            width: 3rem;
            height: 3rem;
            border: 4px solid #444;
            border-top-color: #0d6efd;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #app-loading .title {
            font-size: 1.25rem;
            font-weight: 600;
        }
        #app-loading .subtitle {
            font-size: 0.875rem;
            color: #888;
        }
    </style>
</head>

<body data-bs-theme="dark">

    <div class="status-bar-safe-area"></div>

    <!-- Loading screen — terlihat sampai Blazor app mount -->
    <div id="app-loading">
        <div class="spinner"></div>
        <div class="title">VPS Monitoring Desktop</div>
        <div class="subtitle">Loading…</div>
    </div>

    <!-- Blazor mount point -->
    <div id="app"></div>

    <!-- Error UI (shown kalau Blazor error) -->
    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- Blazor framework script untuk MAUI Hybrid. autostart=false — di-start oleh MAUI host. -->
    <script src="_framework/blazor.webview.js" autostart="false"></script>

    <!-- Fallback: kalau setelah 5 detik Blazor belum load, tambah info untuk debug -->
    <script>
        setTimeout(function () {
            var app = document.getElementById('app');
            if (app && (!app.hasChildNodes() || app.innerHTML.trim() === '')) {
                var loading = document.getElementById('app-loading');
                if (loading) {
                    var sub = loading.querySelector('.subtitle');
                    if (sub) {
                        sub.textContent = 'Blazor gagal inisialisasi. Pastikan .NET 10 Runtime, WebView2 Runtime, dan Windows App Runtime sudah terinstall.';
                        sub.style.color = '#ff8888';
                    }
                }
            }
        }, 5000);
    </script>

</body>

</html>
